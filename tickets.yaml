    acceptanceCriteria:
      - "`pnpm dashboards:build` writes
        compose/grafana/dashboards/mcp-servers.json"
      - "`pnpm smoke` exits 0 and now covers all three dashboards"
      - "Every panel returns data, including the cache hit ratio panel"
      - "Every panel has a non-empty description"
    complete: true

  # ---------------------------------------------------------------------------
  - id: adapter
    title: Adapter interface, Claude Code adapter, and the guide
    priority: 12
    dependencies: [ normaliser ]
    description: |
      Define the only Agent-specific code the Runner is allowed to contain.
      Read "Agent adapters" and "Agents not yet supported" in ./SPEC.md first.

      Before relying on any flag, run `claude --help` and confirm the real
      flag names on version 2.1.270. Correct the adapter to match the help
      output, not any document. Record the verified flags in
      docs/agent-events.md.

      Deliverables:
      - src/adapters/index.ts: the Adapter type with exactly four members:
        name, launch, telemetryEnv and transcriptPaths. Nothing else.
      - src/adapters/claude-code.ts: the only implementation. Headless launch
        with a per-Run MCP configuration file, strict MCP configuration so
        globally configured servers cannot leak into a Run, and the
        permissions flag. Telemetry environment variables pointed at the
        Collector with 1 second export intervals. Prompt logging left off.
        Transcript locator for ~/.claude/projects.
      - docs/adding-an-agent.md: every step and every fact a contributor must
        verify to add a second Agent. State plainly that codex and gemini are
        not installed on this machine, that no event mapping is claimed for
        them, and that no adapter code exists for them.

      Write no Codex adapter and no Gemini adapter. Do not guess their flags.

      Tests: telemetryEnv returns the expected variable set for a given
      endpoint and resource map. launch builds the expected argument vector,
      asserted without spawning a process. transcriptPaths finds a known
      fixture path.
    acceptanceCriteria:
      - "`pnpm vitest run test/adapter.test.ts` passes with no process spawned"
      - "Every Claude Code flag used appears in the output of `claude --help`,
        quoted in docs/agent-events.md"
      - "docs/adding-an-agent.md exists and states that codex and gemini have no
        adapter"
      - "`ls src/adapters` shows exactly index.ts and claude-code.ts"
    complete: true

  # ---------------------------------------------------------------------------
  - id: runner
    title: Run lifecycle, fixtures, checker and results
    priority: 10
    dependencies: [ adapter, session-index ]
    description: |
      Build the optional task runner. Read "Runner" in ./SPEC.md and implement
      all ten numbered lifecycle steps exactly.

      Deliverables:
      - configs/variants.yaml: the Variant definitions. A Variant is a named
        set of MCP servers and nothing more. Ship `none`, which registers no
        server, and `probe`, which registers the Probe Server. Do not invent
        any other built-in name.
      - tasks/hello.yaml: prompt "Create a file called hello.txt containing
        the word hello.", fixture fixtures/empty, checker `test -f hello.txt`,
        timeout 300 seconds.
      - fixtures/empty/: a minimal fixture directory.
      - src/runner/: lifecycle, fresh fixture copy with a git initialisation
        so the Checker can diff, per-Run MCP configuration written under
        runs/<run_id>/, run_start and run_end emission, the settle rule, the
        aggregation from data/events.jsonl filtered by run_id, the Checker
        execution, and the Results row written to results.duckdb table `runs`
        with every column SPEC.md lists.
      - Timeout handling: SIGTERM, then SIGKILL after 10 seconds, then mark
        the Run timed out.
      - cold and warm cache handling, variant-agnostic: cold starts every MCP
        server in the Variant fresh for the Run, warm performs one unrecorded
        priming Run of the same Task first and keeps those processes alive.
      - The run_id to Session link: a Run maps to one or more Sessions, and
        run_id is a label on the Session row, never its key.
      - If docs/agent-events.md records that OTEL_RESOURCE_ATTRIBUTES was not
        honoured, implement the time-window fallback it describes and mark
        the affected rows.

      Isolation rules, all mandatory: never resume a session, never read or
      write anything under ~/.claude, ~/.codex or ~/.gemini except reading a
      Transcript, and keep every per-Run file under runs/<run_id>/.

      Test the pure parts first: aggregation from a fixture Event list,
      Results row construction, timeout state machine, fixture copy. Do not
      start a real Agent in any test.
    acceptanceCriteria:
      - "`pnpm vitest run test/runner.test.ts` passes with no real Agent started"
      - "A test proves the aggregation matches hand-computed totals from a
        fixture Event list"
      - "A test proves every per-Run file lands under runs/<run_id>/ and nothing
        under the home directory is written"
      - "`pnpm verify` exits 0"
    complete: true

  # ---------------------------------------------------------------------------
  - id: runner-bench
    title: End-to-end bench run against a real session
    priority: 8
    dependencies: [ runner, dashboard-mcp ]
    description: |
      COSTS MONEY: this ticket starts real Claude Code sessions. Run the two
      commands below once each. If one fails, fix the cause and retry at most
      twice, then stop and report.

      Prove the Runner end to end on this machine. Read the Runner acceptance
      items in ./SPEC.md first.

      Step 1, no MCP server:
      `pnpm bench --task hello --agent claude-code --variant none --reps 1`
      It must run a real session, pass its Checker, and produce one Results
      row, one run_end Event, and one Session row carrying that run_id.

      Step 2, through the Probe Server:
      `pnpm bench --task hello --agent claude-code --variant probe --reps 1`
      It must additionally produce at least one `mcp_server_call` Event with
      that run_id, and the tool_call Events for the probe tool must carry
      tool_type mcp and mcp_server probe.

      Then add src/dashboards/runs.ts, generated into
      compose/grafana/dashboards/runs.json and committed, with every panel
      the Runs row of the dashboard table in ./SPEC.md lists. Extend
      scripts/smoke.ts to cover it.

      Record in docs/agent-events.md which identification path Claude Code
      actually took: the resource attribute path or the time-window fallback.
    acceptanceCriteria:
      - "Both bench commands exit 0 and their Checker passed"
      - "`pnpm sessions` shows a Session row for each bench Run with the correct
        run_id"
      - "The probe Run produced at least one mcp_server_call Event with that
        run_id"
      - "The probe tool_call Events carry tool_type mcp and mcp_server probe"
      - "`pnpm smoke` exits 0 and now covers all four dashboards"
    complete: true

  # ---------------------------------------------------------------------------
  - id: report
    title: Report command
    priority: 5
    dependencies: [ runner-bench ]
    description: |
      Deliver the comparison output. Read the Report paragraph of "Runner" in
      ./SPEC.md first.

      Test first, against a seeded in-memory results table.

      Deliverable src/report/, wired to the `report` package script:
      - `pnpm report [--task <id>]` prints, per Task and Variant: n, pass
        rate, median turns, median input tokens per turn, median wall time,
        and p95 tool duration.
      - One DuckDB query. No post-processing arithmetic in TypeScript that the
        query could do.
      - A `--json` flag whose output validates against a Zod schema.
      - An empty results table prints a clear "no Runs recorded" line and
        exits 0, not an error.

      Add a companion `pnpm sessions` cross-reference line to the report
      output: the count of Sessions that carry no run_id, labelled as ad hoc.
    acceptanceCriteria:
      - "`pnpm vitest run test/report.test.ts` passes against a seeded table"
      - "`pnpm report` prints a Task by Variant table from the real bench Runs"
      - "`pnpm report --json` output validates against its Zod schema"
      - "`pnpm report` on an empty table exits 0 with a clear message"
    complete: true

