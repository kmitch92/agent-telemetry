  - id: readme
    title: README and clean-clone acceptance sweep
    priority: 1
    planMode: false
    dependencies: [ report ]
    description: |
      Close the run. Read the "Acceptance criteria" section of ./SPEC.md and
      verify every item yourself, in order.

      Deliverable README.md:
      - One paragraph saying what this system is and what it is not.
      - Quick start in exact order: compose up, smoke, sessions, bench,
        report. Every command copy-pasteable.
      - A Session-first explanation: what a Session is, how two concurrent
        Sessions stay separate, and what the idle boundary rule does.
      - How to define a Variant in configs/variants.yaml, with one worked
        example that names no specific product.
      - How to point the system at an MCP server that implements
        docs/mcp-server-events.md, and how to check it with `pnpm mcp:conform`.
      - A pointer to docs/adding-an-agent.md.
      - A Known gaps section listing every acceptance item that does not pass,
