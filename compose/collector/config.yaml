receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  # Placeholder. The `normaliser` ticket fills this processor with the
  # Normaliser transform statements. Keep the empty list until then.
  transform:
    error_mode: ignore
    log_statements: []
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  otlphttp/loki:
    logs_endpoint: http://loki:3100/otlp/v1/logs
    tls:
      insecure: true
  otlphttp/prometheus:
    metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    tls:
      insecure: true
  file:
    path: /data/events.jsonl
    rotation:
      max_megabytes: 100
      max_days: 30
      max_backups: 10
  debug:
    verbosity: normal
    sampling_initial: 5
    sampling_thereafter: 200

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform, batch]
      exporters: [otlphttp/loki, file, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/prometheus, file]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file]
